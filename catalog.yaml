catalog_version: 1.0.0
default_template: application-stack
recommended_score_resource:
  type: application-stack
  class: aws
templates:
- name: network
  path: ./templates/network
  contract: ./templates/network/contract.yaml
  purpose: New four-tier VPC or references to an existing VPC and subnets
  terraform_cr_source_path: ./templates/application-stack
  composition: child
- name: postgres
  path: ./templates/postgres
  contract: ./templates/postgres/contract.yaml
  purpose: Private encrypted PostgreSQL RDS with DB security group
  terraform_cr_source_path: ./templates/application-stack
  composition: child
- name: object-storage
  path: ./templates/object-storage
  contract: ./templates/object-storage/contract.yaml
  purpose: Private versioned S3 bucket with encryption and TLS-only access
  terraform_cr_source_path: ./templates/application-stack
  composition: child
- name: cache
  path: ./templates/cache
  contract: ./templates/cache/contract.yaml
  purpose: Private encrypted Redis or Valkey replication group and security group
  terraform_cr_source_path: ./templates/application-stack
  composition: child
- name: queue
  path: ./templates/queue
  contract: ./templates/queue/contract.yaml
  purpose: Encrypted SQS queue with dead-letter queue
  terraform_cr_source_path: ./templates/application-stack
  composition: child
- name: application-stack
  path: ./templates/application-stack
  contract: ./templates/application-stack/contract.yaml
  purpose: Primary tofu-controller root composing all application infrastructure in
    one state
  terraform_cr_source_path: ./templates/application-stack
  composition: root
