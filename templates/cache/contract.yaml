template_name: cache
template_path: ./templates/cache
purpose: Private encrypted Redis or Valkey replication group and security group
template_version: 1.0.0
required_terraform_version: '>= 1.7.0, < 2.0.0'
required_aws_provider_version: = 5.100.0
required_random_provider_version: = 3.9.1
upstream_modules:
- address: terraform-aws-modules/security-group/aws
  version: 5.3.1
- address: terraform-aws-modules/elasticache/aws
  version: 1.11.1
inputs:
- name: name
  type: string
  required: true
  sensitive: false
  validations: []
- name: vpc_id
  type: string
  required: true
  sensitive: false
  validations: []
- name: subnet_ids
  type: list(string)
  required: true
  sensitive: false
  validations: []
- name: client_cidr_blocks
  type: list(string)
  required: false
  sensitive: false
  validations:
  - Cache clients need valid restricted IPv4 CIDRs.
  default_hcl: '[]'
- name: engine
  type: string
  required: false
  sensitive: false
  validations:
  - Use redis or valkey.
  default_hcl: '"redis"'
- name: engine_version
  type: string
  required: false
  sensitive: false
  validations: []
  default_hcl: 'null'
- name: node_type
  type: string
  required: false
  sensitive: false
  validations:
  - Invalid cache node type.
  default_hcl: '"cache.t4g.small"'
- name: port
  type: number
  required: false
  sensitive: false
  validations:
  - Invalid port.
  default_hcl: '6379'
- name: auth_token
  type: string
  required: false
  sensitive: true
  validations: []
  default_hcl: 'null'
- name: environment
  type: string
  required: false
  sensitive: false
  validations: []
  default_hcl: '"dev"'
- name: tags
  type: map(string)
  required: false
  sensitive: false
  validations: []
  default_hcl: '{}'
outputs:
- name: endpoint
  type: string
  sensitive: false
- name: port
  type: number
  sensitive: false
- name: security_group_id
  type: string
  sensitive: false
optional_components:
- auth_token
dependencies:
- network
estimated_destructive_operations:
- ElastiCache replication group
- cache subnet group
- cache security group
special_teardown_resources:
- ElastiCache deletion and final snapshots can take many minutes
score_resource_type: application-stack
score_class: aws
direct_terraform_cr_root: false
terraform_cr_source_path: ./templates/application-stack
suggested_input_secret_name: secret-<guid>
suggested_output_secret_name: tf-output-<guid>
required_iam_actions:
  elasticache:
  - Describe*
  - CreateReplicationGroup
  - ModifyReplicationGroup
  - DeleteReplicationGroup
  - CreateCacheSubnetGroup
  - ModifyCacheSubnetGroup
  - DeleteCacheSubnetGroup
  - AddTagsToResource
  - RemoveTagsFromResource
  ec2:
  - CreateSecurityGroup
  - DeleteSecurityGroup
  - AuthorizeSecurityGroupIngress
  - RevokeSecurityGroupIngress
  - DescribeSecurityGroups
  - CreateTags
connectivity_assumptions:
- Caller supplied client CIDRs must be routable to cache subnets
- Clients must use TLS
production_safeguards:
- Private endpoints
- At-rest and transit encryption
- Production auth token, Multi-AZ and snapshots
