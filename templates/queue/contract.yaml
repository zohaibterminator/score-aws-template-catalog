template_name: queue
template_path: ./templates/queue
purpose: Encrypted SQS queue with dead-letter queue
template_version: 1.0.0
required_terraform_version: '>= 1.7.0, < 2.0.0'
required_aws_provider_version: = 5.100.0
required_random_provider_version: null
upstream_modules:
- address: terraform-aws-modules/sqs/aws
  version: 4.3.1
inputs:
- name: name
  type: string
  required: true
  sensitive: false
  validations: []
- name: tags
  type: map(string)
  required: false
  sensitive: false
  validations: []
  default_hcl: '{}'
- name: max_receive_count
  type: number
  required: false
  sensitive: false
  validations:
  - Invalid receive count.
  default_hcl: '5'
outputs:
- name: queue_url
  type: string
  sensitive: false
- name: queue_arn
  type: string
  sensitive: false
- name: dead_letter_queue_url
  type: string
  sensitive: false
optional_components: []
dependencies: []
estimated_destructive_operations:
- Main queue and dead-letter queue, including undelivered messages
special_teardown_resources:
- Drain or archive messages before deletion
score_resource_type: application-stack
score_class: aws
direct_terraform_cr_root: false
terraform_cr_source_path: ./templates/application-stack
suggested_input_secret_name: secret-<guid>
suggested_output_secret_name: tf-output-<guid>
required_iam_actions:
  sqs:
  - CreateQueue
  - DeleteQueue
  - GetQueueAttributes
  - SetQueueAttributes
  - GetQueueUrl
  - ListQueueTags
  - TagQueue
  - UntagQueue
connectivity_assumptions:
- Clients need AWS SQS API egress or an existing VPC endpoint
production_safeguards:
- SQS-managed encryption on both queues
- Redrive to DLQ
