template_name: postgres
template_path: ./templates/postgres
purpose: Private encrypted PostgreSQL RDS with DB security group
template_version: 1.0.0
required_terraform_version: '>= 1.7.0, < 2.0.0'
required_aws_provider_version: = 5.100.0
required_random_provider_version: = 3.9.1
upstream_modules:
- address: terraform-aws-modules/security-group/aws
  version: 5.3.1
- address: terraform-aws-modules/rds/aws
  version: 6.13.1
inputs:
- name: name
  type: string
  required: true
  sensitive: false
  validations: []
- name: vpc_id
  type: string
  required: true
  sensitive: false
  validations: []
- name: subnet_ids
  type: list(string)
  required: true
  sensitive: false
  validations: []
- name: client_cidr_blocks
  type: list(string)
  required: false
  sensitive: false
  validations:
  - Database clients need valid restricted IPv4 CIDRs.
  default_hcl: '[]'
- name: db_name
  type: string
  required: false
  sensitive: false
  validations:
  - Invalid PostgreSQL database name.
  default_hcl: '"appdb"'
- name: db_username
  type: string
  required: false
  sensitive: false
  validations: []
  default_hcl: '"scoreadmin"'
- name: db_password
  type: string
  required: true
  sensitive: true
  validations: []
- name: port
  type: number
  required: false
  sensitive: false
  validations:
  - Invalid port.
  default_hcl: '5432'
- name: instance_class
  type: string
  required: false
  sensitive: false
  validations:
  - Invalid RDS instance class.
  default_hcl: '"db.t3.medium"'
- name: allocated_storage
  type: number
  required: false
  sensitive: false
  validations:
  - RDS storage must be 20–65536 GiB.
  default_hcl: '20'
- name: engine_version
  type: string
  required: false
  sensitive: false
  validations: []
  default_hcl: '"16"'
- name: environment
  type: string
  required: false
  sensitive: false
  validations: []
  default_hcl: '"dev"'
- name: allow_prod_destroy
  type: bool
  required: false
  sensitive: false
  validations: []
  default_hcl: 'false'
- name: tags
  type: map(string)
  required: false
  sensitive: false
  validations: []
  default_hcl: '{}'
outputs:
- name: host
  type: string
  sensitive: false
- name: port
  type: number
  sensitive: false
- name: name
  type: string
  sensitive: false
- name: username
  type: string
  sensitive: false
- name: security_group_id
  type: string
  sensitive: false
optional_components: []
dependencies:
- network
estimated_destructive_operations:
- RDS instance
- DB subnet group
- database security group
special_teardown_resources:
- Production deletion protection must be disabled in a reviewed update
- Final snapshot on production destroy
score_resource_type: application-stack
score_class: aws
direct_terraform_cr_root: false
terraform_cr_source_path: ./templates/application-stack
suggested_input_secret_name: secret-<guid>
suggested_output_secret_name: tf-output-<guid>
required_iam_actions:
  rds:
  - Describe*
  - CreateDBInstance
  - ModifyDBInstance
  - DeleteDBInstance
  - CreateDBSubnetGroup
  - ModifyDBSubnetGroup
  - DeleteDBSubnetGroup
  - CreateDBParameterGroup
  - ModifyDBParameterGroup
  - DeleteDBParameterGroup
  - CreateDBOptionGroup
  - DeleteDBOptionGroup
  - AddTagsToResource
  - RemoveTagsFromResource
  ec2:
  - CreateSecurityGroup
  - DeleteSecurityGroup
  - AuthorizeSecurityGroupIngress
  - RevokeSecurityGroupIngress
  - DescribeSecurityGroups
  - CreateTags
connectivity_assumptions:
- Caller supplied client CIDRs must be routable to database subnets
production_safeguards:
- Private endpoint
- Encrypted storage
- Production Multi-AZ, backups, deletion protection and final snapshot
